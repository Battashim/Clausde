<title>Stranger in Madrid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
/* Layout: one phone-width column; a pitch-green band carries place + phase, the scene scrolls, talk controls stay at the bottom. */
:root {
  --bg: #F2F4EE; --surface: #FFFFFF; --fg: #18211B; --muted: #5C6A60; --line: #D9E0D6;
  --pitch: #1E5A38; --pitch-2: #2A6F47; --on-pitch: #EEF6F0; --on-pitch-muted: #BFD8C7;
  --accent: #B3202E; --accent-soft: #F8E3E4;
  --ok: #276A3B; --ok-soft: #E2F1E5; --warn: #8A5300; --warn-soft: #FCEFD9; --info: #1F4E7A; --info-soft: #E3EDF7;
  --ar: "IBM Plex Sans Arabic", "Geeza Pro", "Noto Sans Arabic", Tahoma, sans-serif;
  --es: "Bricolage Grotesque", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1611; --surface: #16211A; --fg: #E5EDE7; --muted: #9AAA9F; --line: #27372D;
  --pitch: #164A2D; --pitch-2: #1D5B39; --on-pitch: #E9F4EC; --on-pitch-muted: #A9C9B4;
  --accent: #F2707A; --accent-soft: #3A1C20;
  --ok: #7CCB92; --ok-soft: #173123; --warn: #F0B860; --warn-soft: #33260F; --info: #8DB8E6; --info-soft: #152536;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1611; --surface: #16211A; --fg: #E5EDE7; --muted: #9AAA9F; --line: #27372D;
  --pitch: #164A2D; --pitch-2: #1D5B39; --on-pitch: #E9F4EC; --on-pitch-muted: #A9C9B4;
  --accent: #F2707A; --accent-soft: #3A1C20;
  --ok: #7CCB92; --ok-soft: #173123; --warn: #F0B860; --warn-soft: #33260F; --info: #8DB8E6; --info-soft: #152536;
  color-scheme: dark }

body { background: var(--bg); color: var(--fg); font-family: var(--ar); font-size: 16px; line-height: 1.6; }
#app { max-width: 560px; margin: 0 auto; min-height: 100%; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ar { font-family: var(--ar); text-align: right; }
.es { font-family: var(--es); text-align: left; }
.big { font-size: 1.25rem; font-weight: 600; }
.huge { font-size: 1.6rem; font-weight: 800; line-height: 1.25; letter-spacing: -0.01em; }
.strong { font-weight: 700; font-size: 1.1rem; }
.muted { color: var(--muted); font-size: .9rem; }
.faint { color: var(--muted); opacity: .8; }
.strike { text-decoration: line-through; color: var(--muted); }
.street { font-family: var(--mono); color: var(--accent); font-size: .95rem; text-align: left; letter-spacing: .02em; }
.street.big { font-size: 1.2rem; }
.sound { font-size: 1.3rem; text-align: right; }
.sound.big { font-size: 1.7rem; }
.sound b { color: var(--accent); font-weight: 700; }
.eyebrow { font-size: .8rem; color: var(--muted); letter-spacing: .04em; text-align: right; }
.h3 { font-size: 1.05rem; font-weight: 700; text-align: right; }
h1 { font-size: 1.8rem; margin: 0; text-wrap: balance; }
.row { display: flex; flex-direction: row-reverse; flex-wrap: wrap; gap: 8px; }
.row > .btn { flex: 1 1 0; min-width: 0; }
.between { justify-content: space-between; align-items: center; }
.btn { border: 0; border-radius: 12px; padding: 12px 16px; background: var(--fg); color: var(--bg); font-weight: 700; cursor: pointer; }
.btn.primary { background: var(--accent); color: #fff; font-size: 1.1rem; padding: 14px 18px; }
.btn.ghost { background: transparent; color: var(--fg); border: 1.5px solid var(--line); }
.btn.small { padding: 6px 12px; font-size: .9rem; }
.btn:disabled { opacity: .4; }

/* Home */
.home, .page { display: flex; flex-direction: column; gap: 16px; padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero { background: repeating-linear-gradient(90deg, var(--pitch) 0 44px, var(--pitch-2) 44px 88px); color: var(--on-pitch); border-radius: 18px; padding: 22px 18px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 4px; text-align: right; }
.hero::after { content: ""; position: absolute; left: -40px; top: 50%; width: 120px; height: 120px; margin-top: -60px; border: 2px solid color-mix(in oklab, var(--on-pitch) 30%, transparent); border-radius: 50%; pointer-events: none; }
.hero h1 { font-size: 2.2rem; position: relative; z-index: 1; }
.hero .kicker { font-family: var(--es); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; font-size: .78rem; color: var(--on-pitch-muted); text-align: right; position: relative; z-index: 1; }
.hero .lede { color: var(--on-pitch-muted); position: relative; z-index: 1; }
.episode { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.episode .title { font-size: 1.7rem; font-weight: 800; line-height: 1.15; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 0; list-style: none; counter-reset: s; }
.steps li { counter-increment: s; font-size: .82rem; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.steps li::before { content: counter(s, arabic-indic) " · "; color: var(--muted); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stats > div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; text-align: right; }
.stats b { font-family: var(--es); font-size: 1.8rem; font-variant-numeric: tabular-nums; display: block; line-height: 1.1; }
.stats .wide { grid-column: 1 / -1; }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: .88rem; }
.checks li { text-align: right; padding-right: 18px; position: relative; color: var(--muted); }
.checks li::before { content: ""; position: absolute; right: 0; top: .55em; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.checks li.no::before { background: var(--warn); }

/* Session */
.session { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
.pitch { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--pitch); color: var(--on-pitch); padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 6px; border-bottom: 3px solid color-mix(in oklab, var(--on-pitch) 25%, transparent); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--pitch); }
.pitch-top, .pitch-bottom { display: flex; flex-direction: row-reverse; justify-content: space-between; align-items: center; gap: 10px; }
.loc { display: flex; flex-direction: column; text-align: right; }
.loc strong { font-size: 1.05rem; }
.loc-es { font-family: var(--es); font-size: .8rem; color: var(--on-pitch-muted); text-align: right; }
.phase { font-size: .8rem; background: color-mix(in oklab, var(--on-pitch) 16%, transparent); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.mission { color: var(--on-pitch-muted); font-size: .85rem; flex: 1; min-width: 0; }
.pitch .btn.ghost { color: var(--on-pitch); border-color: color-mix(in oklab, var(--on-pitch) 35%, transparent); }
.stagebody { flex: 1; display: flex; flex-direction: column; gap: 10px; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stage { font-size: 1.2rem; margin: 0; text-align: right; }
.foot { position: sticky; bottom: 0; background: color-mix(in oklab, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding-top: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; }
.foot:empty { display: none; }
.line { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: opacity .3s; }
.line.mine { border-style: dashed; }
.line.dim { opacity: .55; }
.tag { display: flex; flex-direction: row-reverse; align-items: center; gap: 8px; }
.dot { width: 30px; height: 30px; border-radius: 50%; color: #fff; font: 700 .7rem/30px var(--es); text-align: center; flex: none; }
.who { font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.card.focus { border: 2px solid var(--accent); }
.card.focus.dim { border-width: 1px; border-color: var(--line); opacity: .6; }
.me { align-self: flex-start; background: var(--ok-soft); border-radius: 14px 14px 14px 4px; padding: 8px 12px; max-width: 85%; }
.banner { border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.banner.ok { background: var(--ok-soft); } .banner.warn { background: var(--warn-soft); } .banner.info { background: var(--info-soft); }
.extras { display: flex; flex-direction: column; gap: 8px; }
.extras:empty { display: none; }
.thinking { text-align: right; min-height: 1.2em; }
.choice { text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; }
.example { border-top: 1px solid var(--line); padding-top: 6px; }

/* Talk bar */
.micbar { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.partial { min-height: 1.4em; color: var(--muted); text-align: center; width: 100%; }
.mic { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--fg); color: var(--bg); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform .15s, background .15s; }
.mic.on { background: var(--accent); color: #fff; transform: scale(1.06); box-shadow: 0 0 0 8px var(--accent-soft); }
@media (prefers-reduced-motion: no-preference) { .mic.on { animation: pulse 1.4s ease-in-out infinite; } }
@keyframes pulse { 50% { box-shadow: 0 0 0 14px var(--accent-soft); } }
.mic-ico { width: 16px; height: 26px; border: 3px solid currentColor; border-radius: 10px; position: relative; }
.mic-ico::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 3px; height: 6px; background: currentColor; transform: translateX(-50%); }
.mic-label { font-size: .7rem; font-weight: 700; margin-top: 8px; max-width: 84px; text-align: center; line-height: 1.2; }
.mic:disabled { opacity: .35; }
.typed { display: flex; gap: 6px; width: 100%; }
.type { flex: 1; min-width: 0; font: 1rem var(--es); padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; direction: rtl; }
.tool { padding: 10px 4px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; cursor: pointer; }
.tool.lit { background: var(--warn-soft); border-color: var(--warn); }
.tool.catch { color: var(--accent); }
.tool:disabled { opacity: .4; }

/* Sheets */
.scrim { position: fixed; inset: 0; background: color-mix(in oklab, #000 40%, transparent); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 88vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 20px; padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--accent-soft); border-radius: 8px; padding: 6px 10px; font-family: var(--es); cursor: pointer; }
.page .chip { background: var(--surface); }

/* Settings */
.seg { display: flex; flex-direction: row-reverse; gap: 6px; }
.segbtn { flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; }
.segbtn[aria-checked="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
textarea { font: 1rem var(--es); padding: 10px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); width: 100%; box-sizing: border-box; }
.errbox pre { white-space: pre-wrap; word-break: break-word; font: .75rem var(--mono); margin: 0; }
.check { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 8px; align-items: center; }
</style>
<div id="app" dir="rtl" lang="ar"></div>
<script>/*APP_JS*/</script>
